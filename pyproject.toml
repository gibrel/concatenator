[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyminplate"
version = "0.0.1" # alterar em src/pyminplate/__init__.py também
description = "Minimal Python boilerplate with modern tooling."
readme = "README.md"
requires-python = ">=3.12.12"
license = { file = "LICENSE" }
keywords = ["boilerplate", "python", "pyminplate"]
authors = [{ name = "Gibrel" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.19.1",
  "pytest>=9.0.2",
  "ruff>=0.14.11",
]

[project.scripts]
pyminplate = "pyminplate.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["pyminplate"]
